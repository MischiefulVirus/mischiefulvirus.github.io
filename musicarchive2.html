    <style>

      .music-player {
        width: 100%;
        max-width: 650px;
        margin: 25px auto;

        background: #000;
        color: #ff0000;

        border: 1px solid #ff0000;

        font-family: "Times New Roman", Times, serif;

        box-sizing: border-box;
      }


      .music-player-header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 7px 10px;

        border-bottom: 1px solid #ff0000;

        font-size: 14px;
      }


      .music-player-main {
        padding: 15px;
      }


      .music-info {
        margin-bottom: 15px;
      }


      .current-title {
        font-size: 20px;
        color: #ff0000;
      }


      .current-number {
        margin-top: 3px;
        font-size: 12px;
        color: #ff0000;
      }


      .music-controls {
        display: flex;
        justify-content: center;
        gap: 5px;

        margin-bottom: 15px;
      }


      .music-controls button {
        width: 45px;
        height: 30px;

        background: #000;
        color: #ff0000;

        border: 1px solid #ff0000;

        font-family: "Times New Roman", Times, serif;
        font-size: 14px;

        cursor: pointer;
      }


      .music-controls button:hover {
        background: #ff0000;
        color: #000;
      }


      .music-progress {
        display: flex;
        align-items: center;
        gap: 8px;

        color: #ff0000;
        font-size: 12px;
      }


      .progress-bar {
        flex: 1;

        accent-color: #ff0000;

        cursor: pointer;
      }


      .music-volume {
        display: flex;
        align-items: center;
        gap: 8px;

        margin-top: 10px;

        color: #ff0000;
        font-size: 12px;
      }


      .volume-bar {
        width: 100px;

        accent-color: #ff0000;

        cursor: pointer;
      }


      .music-playlist {
        border-top: 1px solid #ff0000;
      }


      .music-track {
        display: grid;
        grid-template-columns: 40px 1fr;

        width: 100%;

        padding: 8px 10px;

        background: #000;
        color: #ff0000;

        border: 0;
        border-bottom: 1px solid #330000;

        text-align: left;

        font-family: "Times New Roman", Times, serif;
        font-size: 14px;

        cursor: pointer;

        box-sizing: border-box;
      }


      .music-track:hover {
        background: #ff0000;
        color: #000;
      }


      .music-track.active {
        background: #ff0000;
        color: #000;
      }


      .album-title {
        color: #ff0000;

        font-family: "Times New Roman", Times, serif;

        font-size: 24px;

        margin-top: 30px;
        margin-bottom: 10px;
      }

    </style>

    <!-- MUSIC PLAYER JAVASCRIPT -->
    <!-- =============================================== -->

    <script>

      /*
       * INITIALIZE EVERY PLAYER
       */

      document
        .querySelectorAll(".music-player")
        .forEach(player => {


          /*
           * ELEMENTS
           */

          const audio =
            player.querySelector(".audio-player");


          const playButton =
            player.querySelector(".play-button");


          const prevButton =
            player.querySelector(".prev-button");


          const nextButton =
            player.querySelector(".next-button");


          const downloadButton =
            player.querySelector(".download-button");


          const progressBar =
            player.querySelector(".progress-bar");


          const volumeBar =
            player.querySelector(".volume-bar");


          const currentTitle =
            player.querySelector(".current-title");


          const currentNumber =
            player.querySelector(".current-number");


          const currentTime =
            player.querySelector(".current-time");


          const duration =
            player.querySelector(".duration");


          const status =
            player.querySelector(".music-status");


          const trackButtons =
            player.querySelectorAll(".music-track");


          let currentTrack = 0;



          /*
           * LOAD TRACK
           */

          function loadTrack(index) {

            currentTrack = index;


            const track =
              trackButtons[index];


            audio.src =
              track.dataset.url;


            currentTitle.textContent =
              track.dataset.title;


            currentNumber.textContent =
              String(index + 1).padStart(2, "0")
              + " / "
              + String(trackButtons.length)
                .padStart(2, "0");


            trackButtons.forEach(
              button => {

                button.classList.remove(
                  "active"
                );

              }
            );


            track.classList.add("active");


            status.textContent =
              "ready";


            progressBar.value = 0;


            currentTime.textContent =
              "0:00";


            duration.textContent =
              "0:00";

          }



          /*
           * PLAY / PAUSE
           */

          playButton.addEventListener(
            "click",
            () => {

              if (audio.paused) {

                audio.play();

              }

              else {

                audio.pause();

              }

            }
          );



          /*
           * PREVIOUS
           */

          prevButton.addEventListener(
            "click",
            () => {

              if (currentTrack > 0) {

                loadTrack(
                  currentTrack - 1
                );

                audio.play();

              }

            }
          );



          /*
           * NEXT
           */

          nextButton.addEventListener(
            "click",
            () => {

              if (
                currentTrack <
                trackButtons.length - 1
              ) {

                loadTrack(
                  currentTrack + 1
                );

                audio.play();

              }

              else {

                loadTrack(0);

                audio.play();

              }

            }
          );



          /*
           * SELECT TRACK
           */

          trackButtons.forEach(
            (button, index) => {

              button.addEventListener(
                "click",
                () => {

                  loadTrack(index);

                  audio.play();

                }
              );

            }
          );



          /*
           * PLAY STATE
           */

          audio.addEventListener(
            "play",
            () => {

              playButton.textContent =
                "Ⅱ";

              status.textContent =
                "playing";

            }
          );


          audio.addEventListener(
            "pause",
            () => {

              playButton.textContent =
                "▶";

              status.textContent =
                "paused";

            }
          );



          /*
           * PROGRESS
           */

          audio.addEventListener(
            "timeupdate",
            () => {

              if (!audio.duration) {
                return;
              }


              progressBar.value =
                (
                  audio.currentTime /
                  audio.duration
                ) * 100;


              currentTime.textContent =
                formatTime(
                  audio.currentTime
                );

            }
          );



          /*
           * DURATION
           */

          audio.addEventListener(
            "loadedmetadata",
            () => {

              duration.textContent =
                formatTime(
                  audio.duration
                );

            }
          );



          /*
           * SEEK
           */

          progressBar.addEventListener(
            "input",
            () => {

              if (!audio.duration) {
                return;
              }


              audio.currentTime =
                (
                  progressBar.value / 100
                ) * audio.duration;

            }
          );



          /*
           * AUTOMATIC NEXT TRACK
           */

          audio.addEventListener(
            "ended",
            () => {

              if (
                currentTrack <
                trackButtons.length - 1
              ) {

                loadTrack(
                  currentTrack + 1
                );

                audio.play();

              }

              else {

                playButton.textContent =
                  "▶";

                status.textContent =
                  "finished";

              }

            }
          );



          /*
           * VOLUME
           */

          volumeBar.addEventListener(
            "input",
            () => {

              audio.volume =
                volumeBar.value;

            }
          );


          audio.volume = 0.5;



          /*
           * DOWNLOAD
           */

          downloadButton.addEventListener(
            "click",
            () => {

              const track =
                trackButtons[currentTrack];


              const link =
                document.createElement("a");


              link.href =
                track.dataset.url;


              link.download =
                track.dataset.title
                + ".mp3";


              document.body.appendChild(
                link
              );


              link.click();


              document.body.removeChild(
                link
              );

            }
          );



          /*
           * FORMAT TIME
           */

          function formatTime(seconds) {

            if (
              !Number.isFinite(seconds)
            ) {

              return "0:00";

            }


            const minutes =
              Math.floor(seconds / 60);


            const secondsPart =
              Math.floor(seconds % 60);


            return (
              minutes
              + ":"
              + String(secondsPart)
                .padStart(2, "0")
            );

          }



          /*
           * INITIALIZE
           */

          loadTrack(0);

        });

    </script>
