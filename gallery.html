<!DOCTYPE html>
<!-- gallery integration build 2026-11-08b -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gallery</title>
  <link href="./style.css" rel="stylesheet">
  <style>
    #gallery-viewer { width: min(94vw, 1100px); max-width: none; max-height: 92vh; padding: 1rem; border: 1px solid #8b0000; background: #080808; color: #eee; }
    #gallery-viewer::backdrop { background: rgb(0 0 0 / 88%); }
    #gallery-viewer img { display: block; max-width: 100%; max-height: 78vh; width: auto; height: auto; margin: 0 auto; object-fit: contain; }
    #gallery-viewer .viewer-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: .75rem; }
    #gallery-viewer button { color: #eee; background: #250000; border: 1px solid #8b0000; padding: .35rem .7rem; cursor: pointer; }
  </style>
</head>
<body>
  <a href="#content" id="skip-to-content-link">Skip to content</a>
  <div class="layout">
    <header>
      <div class="header-content">
        <div class="header-title"></div>
        <nav>
          <ul>
            <li><a href="/">/</a></li>
            <li><a href="chat.html">/chat</a></li>
            <li><a href="music.html">/music</a></li>
            <li><strong>/gallery</strong></li>
          </ul>
        </nav>
      </div>
    </header>

    <aside class="left-sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">⫘⫘⫘⫘⫘⫘</div>
        <img alt="" src="jji.gif">
      </div>
    </aside>

    <main id="content">
      <section id="gallery-section">
        <h1>gallery</h1>
        <form id="gallery-upload-form">
          <label for="gallery-file">submit an image (jpeg / png / webp, max 5 MB)</label>
          <div class="gallery-upload-controls">
            <input id="gallery-file" name="file" type="file" accept="image/jpeg,image/png,image/webp" required>
            <button id="gallery-submit" type="submit">upload</button>
          </div>
          <p id="gallery-status" role="status" aria-live="polite"></p>
        </form>
        <div id="gallery-grid" class="gallery-grid" aria-live="polite">
          <p>loading images...</p>
        </div>
      </section>
    </main>

    <footer></footer>
  </div>

  <dialog id="gallery-viewer">
    <div class="viewer-top">
      <span id="gallery-viewer-caption"></span>
      <button id="gallery-viewer-close" type="button">close</button>
    </div>
    <img id="gallery-viewer-image" alt="">
  </dialog>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://mkpgkkgqivbohokhwqzz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_oZTa8kXl9UbMsWJXOWrMZw_rg_z8Mdt";
    const UPLOAD_URL = SUPABASE_URL + "/functions/v1/upload-image";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const grid = document.getElementById("gallery-grid");
    const form = document.getElementById("gallery-upload-form");
    const fileInput = document.getElementById("gallery-file");
    const submitButton = document.getElementById("gallery-submit");
    const status = document.getElementById("gallery-status");
    const viewer = document.getElementById("gallery-viewer");
    const viewerImage = document.getElementById("gallery-viewer-image");
    const viewerCaption = document.getElementById("gallery-viewer-caption");
    let galleryItems = [];

    function openImage(item, updateUrl = true) {
      if (!item) return;
      viewerImage.src = imageUrl(item.object_path);
      viewerImage.alt = item.original_name || "Gallery image";
      viewerCaption.textContent = item.original_name || "image";
      if (!viewer.open) viewer.showModal();
      if (updateUrl) {
        const url = new URL(window.location.href);
        url.searchParams.set("image", item.id);
        history.pushState({ galleryImage: item.id }, "", url);
      }
    }

    function closeViewer(updateUrl = true) {
      if (viewer.open) viewer.close();
      viewerImage.removeAttribute("src");
      if (updateUrl) {
        const url = new URL(window.location.href);
        url.searchParams.delete("image");
        history.replaceState({}, "", url);
      }
    }

    document.getElementById("gallery-viewer-close").addEventListener("click", () => closeViewer());
    viewer.addEventListener("click", (event) => {
      if (event.target === viewer) closeViewer();
    });
    viewer.addEventListener("close", () => {
      viewerImage.removeAttribute("src");
    });
    window.addEventListener("popstate", () => {
      const id = new URL(window.location.href).searchParams.get("image");
      const item = galleryItems.find(entry => String(entry.id) === id);
      if (item) openImage(item, false);
      else closeViewer(false);
    });

    function imageUrl(path) {
      return SUPABASE_URL + "/storage/v1/object/public/gallery/" +
        path.split("/").map(encodeURIComponent).join("/");
    }

    async function loadGallery() {
      const { data, error } = await supabase
        .from("gallery_images")
        .select("id,object_path,original_name,created_at")
        .order("created_at", { ascending: false })
        .limit(60);

      if (error) {
        grid.textContent = "could not load gallery.";
        console.error(error);
        return;
      }

      galleryItems = data || [];
      grid.replaceChildren();
      if (!data || data.length === 0) {
        const empty = document.createElement("p");
        empty.textContent = "nothing here yet.";
        grid.append(empty);
        return;
      }

      for (const item of data) {
        const figure = document.createElement("figure");
        const link = document.createElement("a");
        const image = document.createElement("img");
        const caption = document.createElement("figcaption");

        link.href = "?image=" + encodeURIComponent(item.id);
        link.addEventListener("click", (event) => {
          event.preventDefault();
          openImage(item);
        });
        image.src = imageUrl(item.object_path);
        image.alt = item.original_name || "Gallery image";
        image.loading = "lazy";
        image.decoding = "async";
        caption.textContent = item.original_name || "image";

        link.append(image);
        figure.append(link, caption);
        grid.append(figure);
      }

      const requestedId = new URL(window.location.href).searchParams.get("image");
      if (requestedId) {
        const requestedImage = galleryItems.find(entry => String(entry.id) === requestedId);
        if (requestedImage) openImage(requestedImage, false);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
        status.textContent = "only jpeg, png, and webp images are accepted.";
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        status.textContent = "file is larger than 5 MB.";
        return;
      }

      submitButton.disabled = true;
      status.textContent = "uploading...";
      try {
        const body = new FormData();
        body.append("file", file, file.name);
        const response = await fetch(UPLOAD_URL, {
          method: "POST",
          headers: { apikey: SUPABASE_KEY },
          body
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || "upload failed.");
        status.textContent = "uploaded.";
        form.reset();
        await loadGallery();
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : "upload failed.";
      } finally {
        submitButton.disabled = false;
      }
    });

    await loadGallery();
    supabase
      .channel("gallery-live")
      .on("postgres_changes", {
        event: "INSERT",
        schema: "public",
        table: "gallery_images"
      }, () => loadGallery())
      .subscribe();
  </script>
</body>
</html>
