<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gallery</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    #gallery-section { margin-top: 2em; }
    #gallery-upload-form, #gallery-admin { border: 1px solid #400; padding: 12px; margin: 1em 0; }
    #gallery-upload-form label { display:block; margin-bottom:.5em; }
    #gallery-admin { display:flex; flex-direction:column; align-items:stretch; gap:7px; padding:7px; margin-top:1em; }
    #gallery-admin > button { width:100%; }
    #gallery-admin-login-form:not([hidden]) { display:grid; gap:6px; margin:0; }
    #gallery-admin-login-form input { box-sizing:border-box; width:100%; }
    #gallery-admin-status { margin:0; min-height:0; overflow-wrap:anywhere; }
    #gallery-admin > button { white-space:nowrap; }
    #gallery-admin-login-form:not([hidden]) { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0; }
    #gallery-admin-login-form label { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    #gallery-admin-login-form input { width:10rem; }
    #gallery-admin-status { flex:1 1 100%; margin:0; min-height:0; }
    #gallery-admin-queue { flex:1 1 100%; width:100%; }
    #gallery-webhook-panel { flex:1 1 100%; min-width:0; }
    #gallery-webhook-form { display:grid; gap:6px; }
    #gallery-webhook-form label { font-size:.78em; }
    #gallery-webhook-form textarea { box-sizing:border-box; width:100%; max-width:100%; min-height:5em; resize:vertical; color:#f00; background:#080000; border:1px solid #600; padding:.4em; font:inherit; }
    #gallery-webhook-status { margin:4px 0 0; font-size:.75em; overflow-wrap:anywhere; }
    #gallery-upload-form input, #gallery-admin input { max-width:100%; color:#f00; background:#080000; border:1px solid #600; padding:.35em; }
    #gallery-upload-form button, #gallery-admin button, .reaction-row button, #gallery-viewer button {
      color:#f00; background:#080000; border:1px solid #800; padding:.35em .65em; font:inherit; cursor:pointer;
    }
    #gallery-upload-form button:hover, #gallery-admin button:hover, .reaction-row button:hover, #gallery-viewer button:hover { color:#000; background:#f00; }
    button:disabled { opacity:.45; cursor:wait !important; }
    .gallery-upload-controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:.5em 0; }
    #gallery-status, #gallery-admin-status { min-height:1.2em; font-size:.8em; }
    .gallery-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .gallery-leaderboard-link { display:inline-block; margin:1em 0 .75em; padding:.5em .85em; color:#f00; background:#080000; border:1px solid #800; text-decoration:none; }
    .gallery-leaderboard-link:hover { color:#000; background:#f00; }
    .gallery-grid figure { min-width:0; margin:0; border:1px solid #400; padding:6px; }
    .gallery-grid a { display:block; position:relative; }
    .gallery-grid .media-thumb { display:block; width:100%; aspect-ratio:1; object-fit:contain; background:#050000; cursor:pointer; }
    .gallery-grid figcaption { font-size:.72em; overflow-wrap:anywhere; padding-top:5px; }
    .uploader-label { color:#b66; font-size:.68em; }
    .reaction-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
    .reaction-row button { font-size:.72em; }
    .gallery-comment-count { align-self:center; color:#b66; font-size:.72em; margin-left:auto; }
    #gallery-viewer { width:min(94vw,1100px); max-width:none; max-height:94vh; padding:12px; border:1px solid #900; background:#080808; color:#f00; }
    #gallery-viewer::backdrop { background:rgb(0 0 0 / 90%); }
    #gallery-viewer [hidden] { display:none !important; }
    #gallery-comments { border-top:1px solid #500; margin-top:12px; padding-top:10px; }
    #gallery-comments form { display:grid; gap:7px; }
    #gallery-comments input, #gallery-comments textarea { color:#f00; background:#080000; border:1px solid #600; padding:7px; font:inherit; width:100%; box-sizing:border-box; }
    #gallery-comments textarea { min-height:72px; resize:vertical; }
    #gallery-comments button { color:#f00; background:#080000; border:1px solid #800; padding:.35em .65em; font:inherit; cursor:pointer; }
    #gallery-comment-list { display:grid; gap:8px; margin-top:12px; max-height:30vh; overflow:auto; }
    .gallery-comment { border:1px solid #300; padding:8px; overflow-wrap:anywhere; }
    .gallery-comment-meta { color:#b66; font-size:.72em; margin-bottom:4px; }
    .gallery-comment-reactions { display:flex; gap:6px; margin-top:7px; }
    .gallery-comment-reactions button { font-size:.72em; }
    .gallery-comment-reactions button[aria-pressed="true"] { color:#000; background:#f00; border-color:#f00; }
    #gallery-viewer img, #gallery-viewer video { display:block; max-width:100%; max-height:78vh; width:auto; height:auto; margin:0 auto; object-fit:contain; }
    .viewer-top { display:flex; justify-content:space-between; gap:1em; align-items:center; margin-bottom:8px; }
    #gallery-admin-queue { margin-top:1em; overflow-x:auto; }
    #gallery-admin-queue table { width:100%; border-collapse:collapse; font-size:.72em; }
    #gallery-admin-queue td, #gallery-admin-queue th { border:1px solid #400; padding:5px; text-align:left; }
    @media(max-width:800px) { .gallery-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; } }
  </style>
</head>
<body>
  <a href="#content" id="skip-to-content-link">Skip to content</a>
  <div class="layout">
    <header><div class="header-content">
      <nav><ul><li><a href="/">/</a></li><li><a href="../chat.html">/chat</a></li><li><a href="../music.html">/music</a></li><li><strong>/gallery</strong></li><li><a href="../leaderboard.html">/leaderboard</a></li></ul></nav>
    </div></header>
    <aside class="left-sidebar">
      <div class="sidebar-section"><div class="sidebar-title">⫘⫘⫘⫘⫘⫘</div><img alt="" src="../jji.gif"></div>
      <section id="gallery-admin" aria-label="gallery administration">
        <button id="gallery-admin-login-button" type="button">admin login</button>
        <button id="gallery-admin-logout-button" type="button" hidden>log out</button>
        <form id="gallery-admin-login-form" hidden>
          <label for="gallery-admin-password">admin password</label>
          <input id="gallery-admin-password" type="password" autocomplete="current-password" required>
          <button type="submit">log in</button>
        </form>
        <div id="gallery-webhook-panel" hidden>
          <form id="gallery-webhook-form">
            <label for="gallery-webhook-message">webhook message</label>
            <textarea id="gallery-webhook-message" maxlength="2000" rows="4" placeholder="write a message…" required></textarea>
            <button id="gallery-webhook-send" type="submit">send to discord</button>
          </form>
          <p id="gallery-webhook-status" role="status" aria-live="polite"></p>
        </div>
        <p id="gallery-admin-status" role="status" aria-live="polite"></p>
      </section>
    </aside>
    <main id="content">
      <section id="gallery-section">
        <h1>gallery</h1>
        <form id="gallery-upload-form">
          <label for="gallery-file">choose media</label>
          <div class="gallery-upload-controls">
            <input id="gallery-file" name="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/ogg,video/quicktime" required>
            <button id="gallery-submit" type="submit">upload</button>
          </div>
          <div class="gallery-upload-controls">
            <input id="gallery-image-url" type="url" inputmode="url" placeholder="https://… image URL" aria-label="Image URL">
            <button id="gallery-import" type="button">import image URL</button>
          </div>
          <div class="gallery-upload-controls">
            <label for="gallery-anonymous" style="display:flex;align-items:center;gap:7px;margin:0;">
              <input id="gallery-anonymous" type="checkbox">
              upload anonymously
            </label>
          </div>
          <div class="gallery-upload-controls">
            <input id="gallery-cooldown-password" type="password" autocomplete="current-password" placeholder="no-cooldown password" aria-label="No-cooldown password">
            <button id="gallery-cooldown-login" type="button">unlock no cooldown</button>
            <button id="gallery-cooldown-logout" type="button" hidden>lock cooldown</button>
          </div>
          <p id="gallery-cooldown-status" role="status" aria-live="polite"></p>
          <p id="gallery-status" role="status" aria-live="polite"></p>
        </form>

        <div id="gallery-admin-queue" hidden></div>

        <a class="gallery-leaderboard-link" href="../leaderboard.html">view leaderboard →</a>
        <div id="gallery-grid" class="gallery-grid" aria-live="polite"><p>loading submissions…</p></div>
      </section>
    </main>
    <footer></footer>
  </div>

  <dialog id="gallery-viewer">
    <div class="viewer-top"><span id="gallery-viewer-caption"></span><button id="gallery-viewer-close" type="button">close</button></div>
    <img id="gallery-viewer-image" alt="" hidden>
    <video id="gallery-viewer-video" controls playsinline hidden></video>
    <section id="gallery-comments" aria-label="comments">
      <h3>comments</h3>
      <form id="gallery-comment-form">
        <input id="gallery-comment-name" type="text" maxlength="24" placeholder="username (optional; anonymous by default)" aria-label="Optional comment username">
        <textarea id="gallery-comment-body" maxlength="500" placeholder="write a comment…" required aria-label="Comment"></textarea>
        <div><button id="gallery-comment-submit" type="submit">post comment</button></div>
        <p id="gallery-comment-status" role="status" aria-live="polite"></p>
      </form>
      <div id="gallery-comment-list" aria-live="polite"></div>
    </section>
  </dialog>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const SUPABASE_URL = "https://mkpgkkgqivbohokhwqzz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_oZTa8kXl9UbMsWJXOWrMZw_rg_z8Mdt";
    const UPLOAD_URL = SUPABASE_URL + "/functions/v1/upload-image";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = id => document.getElementById(id);
    const grid = $("gallery-grid"), form = $("gallery-upload-form"), fileInput = $("gallery-file");
    const status = $("gallery-status"), submitButton = $("gallery-submit"), importButton = $("gallery-import");
    const viewer = $("gallery-viewer"), viewerImage = $("gallery-viewer-image"), viewerVideo = $("gallery-viewer-video");
    const adminStatus = $("gallery-admin-status");
    let activeCommentImageId = "";
    const MEDIA_TYPES = ["image/jpeg","image/png","image/webp","image/gif","video/mp4","video/webm","video/ogg","video/quicktime"];
    const IMAGE_TYPES = MEDIA_TYPES.filter(type => type.startsWith("image/"));
    const IMAGE_MAX_BYTES = 5 * 1024 * 1024;
    const VIDEO_MAX_BYTES = 10 * 1024 * 1024;
    let adminToken = sessionStorage.getItem("galleryAdminToken") || "";
    let cooldownToken = sessionStorage.getItem("galleryCooldownToken") || "";
    let galleryItems = [];
    let statsById = new Map();
    let visitorId = localStorage.getItem("galleryVisitorId");
    if (!visitorId || !/^[0-9a-f-]{36}$/i.test(visitorId)) {
      visitorId = crypto.randomUUID();
      localStorage.setItem("galleryVisitorId", visitorId);
    }

    function mediaUrl(path) {
      return SUPABASE_URL + "/storage/v1/object/public/gallery/" + path.split("/").map(encodeURIComponent).join("/");
    }
    function isVideo(mime) { return String(mime || "").startsWith("video/"); }
    async function recordView(item) {
      try {
        const result = await api({ action:"view", image_id:item.id, visitor_id:visitorId });
        const stats = statsById.get(item.id) || {upvotes:0,downvotes:0,sobs:0,score:0};
        stats.views = result.views; statsById.set(item.id,stats);
        const viewLabel = document.querySelector('[data-view-count="' + item.id + '"]');
        if (viewLabel) viewLabel.textContent = result.views + " views";
        const caption = $("gallery-viewer-caption");
        if (activeCommentImageId === item.id) caption.textContent = caption.textContent.replace(/ · \d+ views$/, "") + " · " + result.views + " views";
      } catch(error) { console.warn("could not record gallery view",error); }
    }
    function openItem(item, updateUrl = true) {
      if (!item) return;
      closeMedia();
      const uploadedAt = item.created_at ? new Date(item.created_at).toLocaleString() : "upload date unknown";
      $("gallery-viewer-caption").textContent = (item.original_name || "upload") + (item.uploader_name ? " · " + item.uploader_name : "") + " · uploaded " + uploadedAt;
      const url = mediaUrl(item.object_path);
      if (isVideo(item.mime_type)) {
        viewerVideo.src = url; viewerVideo.hidden = false; viewerImage.hidden = true;
      } else {
        viewerImage.src = url; viewerImage.alt = item.original_name || "gallery image";
        viewerImage.hidden = false; viewerVideo.hidden = true;
      }
      activeCommentImageId = item.id;
      if (!viewer.open) viewer.showModal();
      loadComments(item.id);
      recordView(item);
      if (updateUrl) {
        const next = new URL(location.href); next.searchParams.set("image", item.id);
        history.pushState({ galleryImage:item.id }, "", next);
      }
    }
    function closeMedia() {
      viewerVideo.pause(); viewerVideo.removeAttribute("src"); viewerVideo.load();
      viewerImage.removeAttribute("src");
    }
    function closeViewer(updateUrl = true) {
      if (viewer.open) viewer.close();
      closeMedia();
      if (updateUrl) {
        const next = new URL(location.href); next.searchParams.delete("image");
        history.replaceState({}, "", next);
      }
    }
    $("gallery-viewer-close").addEventListener("click", () => closeViewer());
    viewer.addEventListener("click", event => { if (event.target === viewer) closeViewer(); });
    viewer.addEventListener("close", closeMedia);
    window.addEventListener("popstate", () => {
      const id = new URL(location.href).searchParams.get("image");
      const item = galleryItems.find(entry => entry.id === id);
      if (item) openItem(item, false); else closeViewer(false);
    });

    async function api(payload) {
      const response = await fetch(UPLOAD_URL, {
        method:"POST",
        headers:{ apikey:SUPABASE_KEY, "Content-Type":"application/json" },
        body:JSON.stringify(payload)
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "request failed (HTTP " + response.status + ")");
      return result;
    }
    async function adminApi(payload) {
      return api({ ...payload, token:adminToken });
    }
    function updateAdminControls() {
      $("gallery-admin-login-button").hidden = Boolean(adminToken);
      $("gallery-admin-logout-button").hidden = !adminToken;
      $("gallery-webhook-panel").hidden = !adminToken;
      if (!adminToken) { $("gallery-admin-login-form").hidden = true; $("gallery-admin-queue").hidden = true; }
    }
    function addText(parent, tag, text, className) {
      const node = document.createElement(tag); node.textContent = text;
      if (className) node.className = className;
      parent.append(node); return node;
    }

    async function loadComments(imageId) {
      const list = $("gallery-comment-list");
      list.textContent = "loading comments…";
      try {
        const result = await api({ action:"comments-list", image_id:imageId, visitor_id:visitorId });
        if (activeCommentImageId !== imageId) return;
        list.replaceChildren();
        if (!result.comments?.length) { addText(list,"p","no comments yet."); return; }
        for (const comment of result.comments) {
          const article = document.createElement("article"); article.className = "gallery-comment";
          const meta = document.createElement("div"); meta.className = "gallery-comment-meta";
          const who = comment.display_name || "anonymous";
          const photoReaction = comment.vote === 1 ? " · ↑ upvoted photo" : comment.vote === -1 ? " · ↓ downvoted photo" : "";
          meta.textContent = who + photoReaction + " · " + new Date(comment.created_at).toLocaleString();
          article.append(meta);
          addText(article,"div",comment.body);
          const reactions = document.createElement("div"); reactions.className = "gallery-comment-reactions";
          for (const [type,label,count,value] of [
            ["upvote","↑",comment.upvotes || 0,1],["downvote","↓",comment.downvotes || 0,-1]
          ]) {
            const button = document.createElement("button"); button.type = "button";
            button.textContent = label + " " + count;
            button.setAttribute("aria-pressed",String(comment.myVote === value));
            button.setAttribute("aria-label",(type === "upvote" ? "upvote" : "downvote") + " comment");
            button.addEventListener("click",() => sendCommentReaction(imageId,comment.id,type,button));
            reactions.append(button);
          }
          article.append(reactions);
          list.append(article);
        }
      } catch(error) { list.textContent = error.message || "could not load comments."; }
    }
    async function sendCommentReaction(imageId,commentId,reaction,button) {
      button.disabled = true;
      try {
        await api({action:"comment-react",image_id:imageId,comment_id:commentId,visitor_id:visitorId,reaction});
        await loadComments(imageId);
      } catch(error) {
        $("gallery-comment-status").textContent = error.message || "could not save comment vote.";
      } finally { button.disabled = false; }
    }

    $("gallery-comment-form").addEventListener("submit",async event => {
      event.preventDefault();
      const imageId = activeCommentImageId;
      if (!imageId) return;
      const button = $("gallery-comment-submit"), message = $("gallery-comment-status");
      button.disabled = true; message.textContent = "posting…";
      try {
        await api({
          action:"comment-create", image_id:imageId, visitor_id:visitorId,
          display_name:$("gallery-comment-name").value,
          body:$("gallery-comment-body").value
        });
        $("gallery-comment-body").value = "";
        message.textContent = "comment posted.";
        await loadComments(imageId);
      } catch(error) { message.textContent = error.message || "could not post comment."; }
      finally { button.disabled = false; }
    });

    async function sendReaction(item, reaction, button) {
      button.disabled = true;
      try {
        await api({ action:"react", visitor_id:visitorId, image_id:item.id, reaction });
        await loadGallery();
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : "reaction failed.";
      } finally { button.disabled = false; }
    }

    async function loadGallery() {
      const [imagesResult, statsResult] = await Promise.all([
        supabase.from("gallery_images").select("id,object_path,original_name,mime_type,size_bytes,created_at,uploader_name,is_anonymous").order("created_at",{ascending:false}).limit(100),
        supabase.from("gallery_image_stats").select("image_id,upvotes,downvotes,score,sobs,views")
      ]);
      if (imagesResult.error) { grid.textContent = "could not load gallery."; console.error(imagesResult.error); return; }
      galleryItems = imagesResult.data || [];
      statsById = new Map((statsResult.data || []).map(row => [row.image_id,row]));
      let commentCounts = new Map();
      if (galleryItems.length) {
        try {
          const countResult = await api({ action:"comment-counts", image_ids:galleryItems.map(item => item.id) });
          commentCounts = new Map(Object.entries(countResult.counts || {}));
        } catch (error) { console.warn("could not load comment counts", error); }
      }
      grid.replaceChildren();
      if (!galleryItems.length) { addText(grid,"p","nothing here yet."); return; }
      for (const item of galleryItems) {
        const figure = document.createElement("figure");
        const open = document.createElement("a");
        open.href = "?image=" + encodeURIComponent(item.id);
        open.addEventListener("click", event => { event.preventDefault(); openItem(item); });
        let preview;
        if (isVideo(item.mime_type)) {
          preview = document.createElement("video"); preview.muted = true; preview.preload = "metadata";
          preview.src = mediaUrl(item.object_path); preview.playsInline = true;
          preview.addEventListener("click", event => { event.preventDefault(); openItem(item); });
        } else {
          preview = document.createElement("img"); preview.src = mediaUrl(item.object_path);
          preview.alt = item.original_name || "gallery image"; preview.loading = "lazy"; preview.decoding = "async";
        }
        preview.className = "media-thumb"; open.append(preview);
        figure.append(open);
        addText(figure,"figcaption",item.original_name || "upload");
        addText(figure,"div",item.is_anonymous ? "uploaded anonymously" : "uploaded by " + (item.uploader_name || "unknown visitor"),"uploader-label");
        const stats = statsById.get(item.id) || {upvotes:0,downvotes:0,sobs:0,score:0};
        const reactions = document.createElement("div"); reactions.className = "reaction-row";
        for (const [type,label,count] of [
          ["upvote","↑",stats.upvotes],["downvote","↓",stats.downvotes],["sob","sob",stats.sobs]
        ]) {
          const button = document.createElement("button"); button.type = "button";
          button.textContent = label + " " + count;
          button.addEventListener("click", () => sendReaction(item,type,button));
          reactions.append(button);
        }
        const commentCount = document.createElement("span"); commentCount.className = "gallery-comment-count";
        commentCount.textContent = (Number(commentCounts.get(item.id)) || 0) + " comments";
        reactions.append(commentCount);
        const viewCount = addText(figure,"div",(Number(stats.views) || 0) + " views","gallery-comment-count");
        viewCount.dataset.viewCount = item.id;
        figure.append(reactions);
        if (adminToken) {
          const del = document.createElement("button"); del.type = "button"; del.textContent = "delete";
          del.addEventListener("click", async () => {
            if (!confirm("delete this upload?")) return;
            del.disabled = true;
            try { await adminApi({action:"delete",id:item.id}); adminStatus.textContent = "deleted."; await loadGallery(); }
            catch (error) { adminStatus.textContent = error.message || "delete failed."; del.disabled = false; }
          });
          figure.append(del);
        }
        grid.append(figure);
      }
      const requested = new URL(location.href).searchParams.get("image");
      if (requested && !viewer.open) {
        const item = galleryItems.find(entry => entry.id === requested);
        if (item) openItem(item,false);
      }
    }

    async function uploadFile(file) {
      if (!MEDIA_TYPES.includes(file.type)) throw new Error("unsupported media type. use JPEG, PNG, WebP, GIF, MP4, WebM, Ogg, or QuickTime.");
      const maxBytes = isVideo(file.type) ? VIDEO_MAX_BYTES : IMAGE_MAX_BYTES;
      if (file.size < 1 || file.size > maxBytes) throw new Error(isVideo(file.type) ? "video files must be between 1 byte and 10 MB." : "image files must be between 1 byte and 5 MB.");
      submitButton.disabled = true; importButton.disabled = true; status.textContent = "uploading…";
      try {
        const body = new FormData(); body.append("file",file,file.name || "upload"); body.append("visitor_id",visitorId); body.append("anonymous",String($("gallery-anonymous").checked));
        const response = await fetch(UPLOAD_URL,{method:"POST",headers:{
          apikey:SUPABASE_KEY,
          ...(adminToken?{"x-gallery-admin-token":adminToken}:{}),
          ...(cooldownToken?{"x-gallery-cooldown-token":cooldownToken}:{})
        },body});
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || "upload failed (HTTP " + response.status + ")");
        status.textContent = "uploaded as " + (result.uploader_name || "anonymous visitor") + ".";
        form.reset(); await loadGallery();
      } finally { submitButton.disabled = false; importButton.disabled = false; }
    }

    function updateCooldownControls() {
      $("gallery-cooldown-login").hidden = Boolean(cooldownToken);
      $("gallery-cooldown-logout").hidden = !cooldownToken;
      $("gallery-cooldown-password").hidden = Boolean(cooldownToken);
      if (cooldownToken) $("gallery-cooldown-password").value = "";
    }
    $("gallery-cooldown-login").addEventListener("click",async () => {
      const input = $("gallery-cooldown-password");
      const message = $("gallery-cooldown-status");
      message.textContent = "checking password…";
      try {
        const result = await api({action:"cooldown-login",password:input.value});
        cooldownToken = result.token;
        sessionStorage.setItem("galleryCooldownToken",cooldownToken);
        input.value = "";
        updateCooldownControls();
        message.textContent = "no upload cooldown enabled for this session.";
      } catch(error) { message.textContent = error.message || "password check failed."; }
    });
    $("gallery-cooldown-logout").addEventListener("click",() => {
      cooldownToken = "";
      sessionStorage.removeItem("galleryCooldownToken");
      updateCooldownControls();
      $("gallery-cooldown-status").textContent = "upload cooldown restored.";
    });

    $("gallery-admin-login-button").addEventListener("click",() => {
      const login = $("gallery-admin-login-form"); login.hidden = !login.hidden;
      if (!login.hidden) $("gallery-admin-password").focus();
    });
    $("gallery-admin-logout-button").addEventListener("click",() => {
      adminToken = ""; sessionStorage.removeItem("galleryAdminToken");
      adminStatus.textContent = "logged out."; updateAdminControls(); loadGallery();
    });
    $("gallery-admin-login-form").addEventListener("submit",async event => {
      event.preventDefault(); adminStatus.textContent = "logging in…";
      try {
        const result = await api({action:"login",password:$("gallery-admin-password").value});
        adminToken = result.token; sessionStorage.setItem("galleryAdminToken",adminToken);
        $("gallery-admin-password").value = ""; updateAdminControls();
        adminStatus.textContent = "logged in."; await loadGallery(); await loadAdminQueue();
      } catch(error) { adminStatus.textContent = error.message || "login failed."; }
    });
    $("gallery-webhook-form").addEventListener("submit",async event => {
      event.preventDefault();
      const button = $("gallery-webhook-send");
      const message = $("gallery-webhook-message").value.trim();
      const feedback = $("gallery-webhook-status");
      if (!message) { feedback.textContent = "write a message first."; return; }
      button.disabled = true; feedback.textContent = "sending…";
      try {
        await adminApi({action:"webhook-message",message});
        $("gallery-webhook-message").value = "";
        feedback.textContent = "message sent.";
      } catch(error) {
        feedback.textContent = error.message || "could not send message.";
      } finally { button.disabled = false; }
    });
    async function loadAdminQueue() {
      try {
        const result = await adminApi({action:"admin-list"});
        const container = $("gallery-admin-queue"); container.hidden = false; container.replaceChildren();
        const table = document.createElement("table");
        const head = document.createElement("tr");
        for (const label of ["file","uploader","size","submitted","action"]) addText(head,"th",label);
        table.append(head);
        for (const item of result.images || []) {
          const tr = document.createElement("tr");
          addText(tr,"td",item.original_name || item.object_path);
          addText(tr,"td",item.uploader_name || "legacy upload");
          addText(tr,"td",Math.ceil((item.size_bytes || 0)/1024) + " KB");
          addText(tr,"td",item.created_at ? new Date(item.created_at).toLocaleString() : "unknown");
          const cell = document.createElement("td"), button = document.createElement("button");
          button.type = "button"; button.textContent = "delete";
          button.addEventListener("click",async () => {
            if (!confirm("delete this upload?")) return;
            button.disabled = true;
            try { await adminApi({action:"delete",id:item.id}); adminStatus.textContent = "deleted."; await loadAdminQueue(); await loadGallery(); }
            catch(error) { adminStatus.textContent = error.message || "delete failed."; button.disabled = false; }
          });
          cell.append(button); tr.append(cell); table.append(tr);
        }
        container.append(table);
      } catch(error) { adminStatus.textContent = error.message || "could not load moderation queue."; }
    }
    form.addEventListener("submit",async event => {
      event.preventDefault(); const file = fileInput.files?.[0];
      if (!file) { status.textContent = "choose a file first."; return; }
      try { await uploadFile(file); } catch(error) { status.textContent = error.message || "upload failed."; }
    });
    importButton.addEventListener("click",async () => {
      let parsed;
      try { parsed = new URL($("gallery-image-url").value.trim()); }
      catch { status.textContent = "enter a valid image URL."; return; }
      if (!["http:","https:"].includes(parsed.protocol)) { status.textContent = "only HTTP and HTTPS URLs are accepted."; return; }
      importButton.disabled = true; status.textContent = "fetching image…";
      try {
        const response = await fetch(parsed.href,{mode:"cors"});
        if (!response.ok) throw new Error("image source returned HTTP " + response.status);
        const blob = await response.blob();
        if (!IMAGE_TYPES.includes(blob.type.split(";")[0].toLowerCase())) throw new Error("URL must return a supported image.");
        if (blob.size > IMAGE_MAX_BYTES) throw new Error("image exceeds the 5 MB limit.");
        const ext = blob.type === "image/jpeg" ? "jpg" : blob.type.split("/")[1];
        const name = decodeURIComponent(parsed.pathname.split("/").pop() || "imported-image." + ext);
        await uploadFile(new File([blob],name,{type:blob.type}));
        $("gallery-image-url").value = "";
      } catch(error) {
        status.textContent = error.message?.includes("Failed to fetch") ? "that host blocks browser imports (CORS)." : (error.message || "could not import URL.");
      } finally { importButton.disabled = false; }
    });

    updateAdminControls();
    updateCooldownControls();
    await loadGallery();
    if (adminToken) await loadAdminQueue();
    supabase.channel("gallery-live").on("postgres_changes",{event:"*",schema:"public",table:"gallery_images"},loadGallery).subscribe();
  </script>
</body>
</html>
