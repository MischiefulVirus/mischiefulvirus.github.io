<!DOCTYPE html>
<!-- gallery integration build 2026-11-08d -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gallery</title>
  <link href="../style.css" rel="stylesheet">
</head>
<body>
  <a href="#content" id="skip-to-content-link">Skip to content</a>
  <div class="layout">
    <header>
      <div class="header-content">
        <div class="header-title"></div>
        <nav>
          <ul>
            <li><a href="/">/</a></li>
            <li><a href="../chat.html">/chat</a></li>
            <li><a href="../music.html">/music</a></li>
            <li><strong>/gallery</strong></li>
          </ul>
        </nav>
      </div>
    </header>

    <aside class="left-sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">⫘⫘⫘⫘⫘⫘</div>
        <img alt="" src="../jji.gif">
      </div>
    </aside>

    <main id="content">
      <section id="gallery-section">
        <h1>gallery</h1>
        <form id="gallery-upload-form">
          <label for="gallery-file">submit an image (jpeg / png / webp, max 5 MB)</label>
          <div class="gallery-upload-controls">
            <input id="gallery-file" name="file" type="file" accept="image/jpeg,image/png,image/webp">
            <button id="gallery-submit" type="submit">upload</button>
          </div>
          <div class="gallery-upload-controls">
            <input id="gallery-image-url" type="url" inputmode="url" placeholder="https://… image URL" aria-label="Image URL">
            <button id="gallery-import" type="button">import URL</button>
          </div>
          <p id="gallery-status" role="status" aria-live="polite"></p>
        </form>
        <div id="gallery-grid" class="gallery-grid" aria-live="polite">
          <p>loading images...</p>
        </div>
      </section>
    </main>

    <footer></footer>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://mkpgkkgqivbohokhwqzz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_oZTa8kXl9UbMsWJXOWrMZw_rg_z8Mdt";
    const UPLOAD_URL = SUPABASE_URL + "/functions/v1/upload-image";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const grid = document.getElementById("gallery-grid");
    const form = document.getElementById("gallery-upload-form");
    const fileInput = document.getElementById("gallery-file");
    const submitButton = document.getElementById("gallery-submit");
    const status = document.getElementById("gallery-status");

    function imageUrl(path) {
      return SUPABASE_URL + "/storage/v1/object/public/gallery/" +
        path.split("/").map(encodeURIComponent).join("/");
    }

    async function loadGallery() {
      const { data, error } = await supabase
        .from("gallery_images")
        .select("id,object_path,original_name,created_at")
        .order("created_at", { ascending: false })
        .limit(60);

      if (error) {
        grid.textContent = "could not load gallery.";
        console.error(error);
        return;
      }

      grid.replaceChildren();
      if (!data || data.length === 0) {
        const empty = document.createElement("p");
        empty.textContent = "nothing here yet.";
        grid.append(empty);
        return;
      }

      for (const item of data) {
        const figure = document.createElement("figure");
        const link = document.createElement("a");
        const image = document.createElement("img");
        const caption = document.createElement("figcaption");

        link.href = imageUrl(item.object_path);
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        image.src = imageUrl(item.object_path);
        image.alt = item.original_name || "Gallery image";
        image.loading = "lazy";
        image.decoding = "async";
        caption.textContent = item.original_name || "image";

        link.append(image);
        figure.append(link, caption);
        grid.append(figure);
      }
    }

    async function uploadFile(file) {
      if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
        throw new Error("only jpeg, png, and webp images are accepted.");
      }
      if (file.size > 5 * 1024 * 1024) {
        throw new Error("file is larger than 5 MB.");
      }
      submitButton.disabled = true;
      importButton.disabled = true;
      status.textContent = "uploading…";
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 45000);
      try {
        const body = new FormData();
        body.append("file", file, file.name || "image");
        const response = await fetch(UPLOAD_URL, {
          method: "POST",
          headers: { apikey: SUPABASE_KEY },
          body,
          signal: controller.signal
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          const detail = result.error || result.message || ("server returned HTTP " + response.status);
          throw new Error(detail);
        }
        status.textContent = "uploaded.";
        form.reset();
        await loadGallery();
      } catch (error) {
        if (error && error.name === "AbortError") {
          throw new Error("upload timed out after 45 seconds. the server may be unavailable; try again.");
        }
        throw error;
      } finally {
        clearTimeout(timeout);
        submitButton.disabled = false;
        importButton.disabled = false;
      }
    }

    const importButton = document.getElementById("gallery-import");
    const urlInput = document.getElementById("gallery-image-url");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        status.textContent = "choose a file or import an image URL first.";
        return;
      }
      try {
        await uploadFile(file);
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : "upload failed.";
      }
    });

    importButton.addEventListener("click", async () => {
      const rawUrl = urlInput.value.trim();
      if (!rawUrl) {
        status.textContent = "enter an image URL first.";
        return;
      }
      let parsed;
      try {
        parsed = new URL(rawUrl);
      } catch {
        status.textContent = "that URL is not valid.";
        return;
      }
      if (!["https:", "http:"].includes(parsed.protocol)) {
        status.textContent = "only http and https image URLs are supported.";
        return;
      }
      importButton.disabled = true;
      status.textContent = "fetching image from URL…";
      try {
        const response = await fetch(parsed.href, { mode: "cors" });
        if (!response.ok) throw new Error("image source returned HTTP " + response.status);
        const blob = await response.blob();
        const type = blob.type.split(";")[0].toLowerCase();
        if (!["image/jpeg", "image/png", "image/webp"].includes(type)) {
          throw new Error("URL must return a JPEG, PNG, or WebP image.");
        }
        if (blob.size > 5 * 1024 * 1024) throw new Error("image is larger than 5 MB.");
        const lastPart = decodeURIComponent(parsed.pathname.split("/").pop() || "imported-image");
        const safeName = /\.(jpe?g|png|webp)$/i.test(lastPart) ? lastPart : "imported-image." + (type === "image/jpeg" ? "jpg" : type.split("/")[1]);
        const file = new File([blob], safeName, { type });
        await uploadFile(file);
        urlInput.value = "";
      } catch (error) {
        status.textContent = error instanceof Error
          ? (error.message.includes("Failed to fetch") ? "could not fetch that URL (the image host may block browser imports with CORS)." : error.message)
          : "could not import image URL.";
        importButton.disabled = false;
      }
    });

    await loadGallery();
    supabase
      .channel("gallery-live")
      .on("postgres_changes", {
        event: "INSERT",
        schema: "public",
        table: "gallery_images"
      }, () => loadGallery())
      .subscribe();
  </script>
</body>
</html>
