```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: "Times New Roman", serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        main {
            max-width: 500px;
            padding: 2rem;
            text-align: center;
        }

        p {
            line-height: 1.6;
        }

        #countdown {
            color: #f00;
        }

        a {
            color: #f00;
        }
    </style>
</head>
<body>
    <main>
        <p>
            going to the music webpage, meant to be standalone so
            theres no way to get back to the main website from there.
            simply remove /m from the url to get back to the main page.
        </p>

        <p>redirecting in <span id="countdown">5</span> seconds...</p>
        <p><a href="/m">continue now</a></p>
    </main>

    <script>
        let seconds = 5;
        const countdown = document.getElementById("countdown");

        const timer = setInterval(() => {
            seconds--;
            countdown.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = "/m";
            }
        }, 1000);
    </script>
</body>
</html>
